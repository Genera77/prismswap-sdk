name: bootstrap-public-sdk

on:
  push:
    paths:
      - 'bootstrap/sdk.part*'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract reviewed public source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/sdk.part* | base64 -d > /tmp/prismswap-sdk.tar.gz
          echo '5829bbb56e7c48d5887d39a4123c3fcdb2b3d511f4630501d7c16cdbe688a5df  /tmp/prismswap-sdk.tar.gz' | sha256sum -c -
          tar -xzf /tmp/prismswap-sdk.tar.gz

      - name: Use Node 20.18.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install
        run: npm ci

      - name: Run repository verification
        run: npm run verify

      - name: Inspect SDK package contents without publishing
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json -w @prismswap/escrow-sdk > /tmp/escrow-sdk-pack.json
          cat /tmp/escrow-sdk-pack.json

      - name: Commit extracted source and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: initialize PrismSwap public SDK'
          git push
